<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار مقدمة في الرعاية الصحية</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#eef4f7;margin:0;padding:16px;color:#1d2b36}
.wrap{max-width:760px;margin:auto}
h1{text-align:center;color:#0b6e7f;font-size:24px}
.info{text-align:center;color:#555;margin-bottom:16px}
.q{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.q h3{margin:0 0 10px;font-size:17px;line-height:1.6}
label{display:block;padding:9px 12px;margin:6px 0;border:1px solid #d6e2e8;border-radius:8px;cursor:pointer}
label:hover{background:#f3f9fb}
input{margin-left:8px}
.correct{background:#d9f5df!important;border-color:#2e9e4f}
.wrong{background:#fbdcdc!important;border-color:#c93c3c}
button{display:block;margin:20px auto;padding:12px 40px;font-size:18px;background:#0b6e7f;color:#fff;border:0;border-radius:10px;cursor:pointer}
#result{text-align:center;font-size:22px;font-weight:bold;color:#0b6e7f;margin:16px 0}
.tag{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="wrap">
<h1>اختبار مقدمة في الرعاية الصحية</h1>
<div class="info">اختر الإجابة الصحيحة لكل سؤال، ثم اضغط «تصحيح الاختبار» في الأسفل.</div>
<div id="quiz"></div>
<button id="btn" onclick="grade()">تصحيح الاختبار</button>
<div id="result"></div>
<button onclick="location.reload()" style="background:#777;font-size:15px">إعادة الاختبار</button>
</div>
<script>
const Q=[
["الحضارة التي بدأت علوم الطب الحديث وفقًا للمقرر:",["المصرية القديمة","اليونانية (الإغريقية)","الصينية","الرومانية"],1],
["المواد التي استُخدمت أدويةً في العصور الأولى:",["المعادن","الأعشاب والنباتات","المضادات الحيوية","الأملاح الكيميائية"],1],
["سبب عدم إلمام الصينيين قديمًا ببنية جسم الإنسان:",["قلة الأطباء","منع تشريح الجثث لأسباب دينية وثقافية","عدم وجود كتب طبية","انتشار الأوبئة"],1],
["الحضارة التي آمنت بعلاج الروح:",["المصرية القديمة","الرومانية","اليونانية","الهندية"],0],
["سجّل المصريون القدماء الحالات الصحية على:",["الألواح الطينية","لفائف البردي","الجلود","الحجارة فقط"],1],
["أنشأ الرومان أول مستشفيات عسكرية لعلاج الجنود الجرحى، وتسمى:",["Valetudinaria","Bimaristan","Asclepieion","Hospitium"],0],
["أدرك الرومان أن الوقاية من الأمراض ترتبط بـ:",["السحر والطقوس","النظافة الشخصية والمياه النظيفة والصرف الصحي","الصيام","الأعشاب فقط"],1],
["العالم الذي وصف الجدري والحصبة:",["ابن سينا","ابن النفيس","أبو بكر الرازي","الزهراوي"],2],
["أول من شرح الدورة الدموية الرئوية:",["ابن النفيس","الرازي","ابن سينا","أبقراط"],0],
["كتاب ابن سينا الطبي الشهير:",["الحاوي","القانون في الطب","التصريف","الشامل"],1],
["المشروع العلمي الذي اكتمل عام 2003م:",["أول لقاح","استنساخ النعجة دوللي","مشروع الجينوم البشري","أول زراعة قلب"],2],
["المثال على جائحة تفشت قديمًا:",["الطاعون (الموت الأسود)","كورونا","ميرس","إيبولا"],0],
["الفيروس المرتبط بالإنفلونزا الإسبانية:",["H5N1","H1N1","H3N2","H7N9"],1],
["تفشت الإنفلونزا الإسبانية في الفترة:",["1818–1820م","1918–1920م","1957م","2009م"],1],
["سبب تسمية الإنفلونزا الإسبانية بهذا الاسم:",["بدأت في إسبانيا","صحافة إسبانيا المحايدة نقلت أخباره بحرية","اكتشفها طبيب إسباني","أكثر الوفيات في إسبانيا"],1],
["من آثار الإنفلونزا الإسبانية:",["وفاة أعداد ضخمة وزيادة الاهتمام بالصحة العامة","القضاء على الأوبئة نهائيًا","اكتشاف البنسلين","لم يكن لها أثر"],0],
["ظهر فيروس إيبولا وفقًا للمقرر عام:",["1918م","1976م","2003م","2012م"],1],
["الحيوان المرتبط بانتقال متلازمة الشرق الأوسط التنفسية (MERS):",["الخفافيش فقط","الإبل","الطيور","الخنازير"],1],
["متلازمة MERS مرض تنفسي حاد يسببه:",["بكتيريا","أحد فيروسات كورونا","فطريات","طفيليات"],1],
["الجائحة هي:",["مرض محدود في مدينة واحدة","انتشار عالمي لمرض معدٍ يصيب نسبة كبيرة من السكان في قارات متعددة","مرض وراثي","مرض غير معدٍ"],1],
["من أسباب سرعة انتشار الفيروسات في العصر الحديث:",["كثرة السفر والتنقل بين الدول","قلة السكان","تحسن النظافة","اللقاحات"],0],
["خطورة الفيروسات المستجدة تكمن في:",["أنها لا تتحور","عدم وجود مناعة مسبقة ضدها وقدرتها على التحور","أنها تصيب الحيوانات فقط","سهولة علاجها"],1],
["من خطط الحكومات لمواجهة جائحة الإنفلونزا:",["إغلاق المستشفيات","تخزين الأدوية واللقاحات وبرامج التطعيم السريع","إيقاف التوعية","تقليل عدد الأطباء"],1],
["يرمز الاختصار WHO إلى:",["وزارة الصحة","منظمة الصحة العالمية","هيئة الصحة العامة","الهلال الأحمر"],1],
["الجهة التي تقدم خدمات الرعاية الصحية عبر التجمعات الصحية:",["وزارة الصحة","وزارة التعليم","منظمة الصحة العالمية","القطاع الخاص فقط"],0],
["التجمع (العنقود) الصحي هو:",["مستشفى واحد كبير","مجموعة منشآت صحية متكاملة تخدم منطقة جغرافية محددة","صيدلية مركزية","مختبر وطني"],1],
["من أدوار هيئة الصحة العامة:",["بناء الطرق","مراقبة الأوبئة والوقاية من الأمراض","بيع الأدوية","تدريس الطب"],1],
["خدمات العيادات الخارجية (Outpatient) هي خدمات:",["تتطلب التنويم أسابيع","يعود فيها المريض إلى منزله في اليوم نفسه","للطوارئ فقط","تقدم في المنزل"],1],
["خدمات الرعاية الطارئة تقدم لـ:",["الفحوص الروتينية","الحالات المفاجئة الخطيرة التي تهدد الحياة","التجميل","كبار السن فقط"],1],
["رعاية كبار السن تسمى:",["Pediatric Care","Geriatric Care","Emergency Care","Outpatient Care"],1],
["ما يميز المستشفيات الجامعية:",["لا تقدم علاجًا","تجمع بين العلاج والتعليم الطبي والبحث العلمي","للعسكريين فقط","تعمل نهارًا فقط"],1],
["من أمثلة الرعاية الصحية المنزلية:",["العمليات الجراحية الكبرى","الرعاية التمريضية والعلاج الطبيعي والعناية بالجروح","الأشعة المقطعية","زراعة الأعضاء"],1],
["المختبرات الطبية من مرافق الرعاية الصحية ودورها:",["بيع الأدوية","إجراء التحاليل للمساعدة في التشخيص والمتابعة","تنويم المرضى","الإسعاف"],1],
["احتواء التكلفة (Cost Containment) هو:",["رفع أسعار الخدمات","إجراءات للحد من تكاليف الرعاية مع المحافظة على الجودة","إلغاء الخدمات الصحية","زيادة مدة التنويم"],1],
["تقليل مدة البقاء في المستشفى:",["يزيد التكاليف","يساعد على احتواء التكاليف","لا علاقة له بالتكاليف","يقلل الجودة دائمًا"],1],
["المجال التقني الذي أسهم في تطورات سريعة في الرعاية الصحية:",["الزراعة","تقنية المعلومات (IT)","التعدين","النسيج"],1],
["من تقنيات التطبيب عن بُعد:",["مكالمات الفيديو والأجهزة القابلة للارتداء","التشريح","الحجامة","التنويم"],0],
["من متطلبات التطبيب عن بُعد:",["إنترنت قوي وأجهزة بكاميرا وميكروفون وتطبيقات آمنة","غرفة عمليات","سيارة إسعاف","سرير مستشفى"],0],
["الخلايا الجذعية:",["متخصصة بوظيفة واحدة","غير متخصصة وقادرة على التحول إلى أنواع مختلفة من الخلايا","خلايا ميتة","خلايا دم فقط"],1],
["تتعامل تقنية النانو مع مواد بمقياس:",["1–100 نانومتر","1–100 ملم","1–100 سم","1–100 متر"],0],
["من أهداف تقنية النانو في الطب:",["إيصال الدواء مباشرة للخلايا المصابة","زيادة حجم الأدوية","إلغاء التشخيص","زيادة الآثار الجانبية"],0],
["العلاج البديل هو:",["الطب الحديث","استخدام طرق علاجية غير تقليدية بدلًا من الطب الحديث","الجراحة","العلاج الكيميائي"],1],
["من أمثلة الطب التكميلي أو البديل:",["الوخز بالإبر والحجامة والأعشاب","المضادات الحيوية","الأشعة","غسيل الكلى"],0],
["الحجامة تصنف ضمن:",["الطب التكميلي أو البديل","الجراحة العامة","العلاج الكيميائي","الأشعة"],0],
["العافية هي:",["مجرد غياب المرض","حالة من الصحة والتوازن الجسدي والنفسي والاجتماعي","القوة البدنية فقط","الثراء"],1],
["أي مما يلي ليس من جوانب العافية الواردة في المقرر؟",["الجسدية","العاطفية","الاقتصادية","الروحية"],2],
["القدرة على فهم المشاعر والتعبير عنها والتعامل معها بإيجابية هي العافية:",["الفكرية","العاطفية","الجسدية","الاجتماعية"],1],
["القدرة على التعلم والتفكير النقدي وحل المشكلات هي العافية:",["الفكرية","الروحية","العاطفية","الجسدية"],0],
["من طرق المحافظة على العافية الجسدية:",["الرياضة والغذاء المتوازن والنوم الكافي","السهر","الوجبات السريعة","قلة الحركة"],0],
["دور المركز السعودي لاعتماد المنشآت الصحية (CBAHI):",["وضع معايير الجودة وسلامة المرضى وتقييم المنشآت واعتمادها","بيع الأدوية","تدريس الطب","الإغاثة الدولية"],0],
["من أهمية معايير الاعتماد وسلامة المرضى:",["زيادة الأخطاء الطبية","تقليل الأخطاء ورفع الجودة وتعزيز الثقة","رفع الأسعار","تقليل عدد المرضى"],1],
["من المنشآت التي يعتمدها CBAHI:",["المستشفيات ومراكز الرعاية الأولية والمختبرات وبنوك الدم","المدارس","البنوك التجارية","المطارات"],0],
["أُسس مركز الملك سلمان للإغاثة والأعمال الإنسانية عام:",["2005م","2015م","2020م","1995م"],1],
["من برامج مركز الملك سلمان للإغاثة:",["مشروع «مسام» لنزع الألغام","بناء الملاعب","مشروع الجينوم","اعتماد المستشفيات"],0]
];
const box=document.getElementById('quiz');
Q.forEach((q,i)=>{let h=`<div class="q" id="q${i}"><span class="tag">سؤال ${i+1} من ${Q.length}</span><h3>${q[0]}</h3>`;
q[1].forEach((o,j)=>{h+=`<label id="l${i}_${j}"><input type="radio" name="q${i}" value="${j}">${o}</label>`});
box.innerHTML+=h+`</div>`});
function grade(){let s=0;Q.forEach((q,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);
document.getElementById(`l${i}_${q[2]}`).classList.add('correct');
if(c){if(+c.value===q[2])s++;else document.getElementById(`l${i}_${c.value}`).classList.add('wrong');}});
const p=Math.round(s/Q.length*100);
document.getElementById('result').innerHTML=`نتيجتك: ${s} من ${Q.length} (${p}%)`+(p>=90?' ممتاز 🌟':p>=70?' جيد جدًا 👍':' راجع الأسئلة وحاول مرة ثانية 💪');
document.getElementById('result').scrollIntoView({behavior:'smooth'});}
</script>
</body>
</html>
