<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار مقدمة في الرعاية الصحية</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#eef4f7;margin:0;padding:16px;color:#1d2b36}
.wrap{max-width:780px;margin:auto}
h1{text-align:center;color:#0b6e7f;font-size:24px;margin-bottom:4px}
.info{text-align:center;color:#555;margin-bottom:16px;font-size:15px}
.bar{position:sticky;top:0;background:#0b6e7f;color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:16px;z-index:5}
.q{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.q h3{margin:0 0 10px;font-size:17px;line-height:1.6}
.tag{font-size:12px;color:#888;display:block;margin-bottom:4px}
label{display:block;padding:9px 12px;margin:6px 0;border:1px solid #d6e2e8;border-radius:8px;cursor:pointer;transition:.15s}
label:hover{background:#f3f9fb}
input{margin-left:8px}
.correct{background:#d9f5df!important;border-color:#2e9e4f!important;font-weight:bold}
.wrong{background:#fbdcdc!important;border-color:#c93c3c!important}
.done label{cursor:default}
.fb{margin-top:8px;font-size:15px;font-weight:bold}
.fb.ok{color:#2e9e4f}
.fb.no{color:#c93c3c}
</style>
</head>
<body>
<div class="wrap">
<h1>اختبار مقدمة في الرعاية الصحية</h1>
<div class="info">اختر إجابة كل سؤال، وتظهر لك النتيجة فورًا: الأخضر صح والأحمر خطأ.</div>
<div class="bar" id="bar">النتيجة: 0 من 0</div>
<div id="quiz"></div>
</div>
<script>
const Q=[["الحضارة التي بدأت علوم الطب الحديث وفقًا للمقرر:",["المصرية القديمة","اليونانية (الإغريقية)","الصينية","الرومانية"],1],["المواد التي استُخدمت أدويةً في العصور الأولى:",["المعادن","الأعشاب والنباتات","المضادات الحيوية","الأملاح الكيميائية"],1],["سبب عدم إلمام الصينيين قديمًا ببنية جسم الإنسان:",["قلة الأطباء","منع تشريح الجثث لأسباب دينية وثقافية","عدم وجود كتب طبية","انتشار الأوبئة"],1],["الحضارة التي آمنت بعلاج الروح:",["المصرية القديمة","الرومانية","اليونانية","الهندية"],0],["من الذين كانوا يؤمنون بعلاج الروح في الحضارات القديمة؟",["الرومان فقط","البابليون والمصريون الأوائل عبر الطقوس الدينية","الإغريق فقط","الصينيون"],1],["سجّل المصريون القدماء الحالات الصحية على:",["الألواح الطينية","لفائف البردي","الجلود","الحجارة فقط"],1],["أنشأ الرومان أول مستشفيات عسكرية لعلاج الجنود الجرحى، وتسمى:",["Valetudinaria","Bimaristan","Asclepieion","Hospitium"],0],["أدرك الرومان أن الوقاية من الأمراض ترتبط بـ:",["السحر والطقوس","النظافة الشخصية والمياه النظيفة والصرف الصحي","الصيام","الأعشاب فقط"],1],["العالم الذي وصف الجدري والحصبة:",["ابن سينا","ابن النفيس","أبو بكر الرازي","الزهراوي"],2],["أول من شرح الدورة الدموية الرئوية:",["ابن النفيس","الرازي","ابن سينا","أبقراط"],0],["كتاب ابن سينا الطبي الشهير:",["الحاوي","القانون في الطب","التصريف","الشامل"],1],["في أي كتاب وثّق ابن سينا نظامه الطبي؟",["الحاوي في الطب","القانون في الطب","كتاب التصريف","المنصوري"],1],["من أوائل من أسهموا في أسس الطب الحديث عبر العصور الإسلامية:",["ابن سينا والرازي","ابن خلدون","الخوارزمي","ابن الهيثم"],0],["المشروع العلمي الذي اكتمل عام 2003م:",["أول لقاح","مشروع الجينوم البشري","الفكوك","أول زراعة قلب"],1],["الاسم الإنجليزي لمشروع الجينوم البشري المكتمل عام 2003م:",["Human Genome Project","Gene Therapy Plan","DNB Index","Global Health Study"],0],["من أي حضارة حُظر فيها التشريح ولم يكن لديها إلمام ببنية جسم الإنسان؟",["المصرية","الصينية القديمة","اليونانية","الرومانية"],1],["المثال على جائحة تفشت قديمًا:",["الطاعون (الموت الأسود)","كورونا","ميرس","إيبولا"],0],["ما مرض الطاعون الدبلي؟",["مرض بكتيري معدٍ يسبب تورمًا مؤلمًا في الغدد الليمفاوية","مرض فيروسي جلدي","مرض وراثي","مرض تنفسي مزمن"],0],["الفيروس المرتبط بالإنفلونزا الإسبانية:",["H5N1","H1N1","H3N2","H7N9"],1],["تفشت الإنفلونزا الإسبانية في الفترة:",["1818–1820م","1918–1920م","1957م","2009م"],1],["كم بلغ تقدير الوفيات في جائحة الإنفلونزا الإسبانية؟",["مئات فقط","عشرات الملايين (20–50 مليون أو أكثر)","مليون واحد","عشرة آلاف"],1],["سبب تسمية الإنفلونزا الإسبانية بهذا الاسم:",["بدأت في إسبانيا","صحافة إسبانيا المحايدة نقلت أخباره بحرية","اكتشفها طبيب إسباني","أكثر الوفيات في إسبانيا"],1],["من آثار الإنفلونزا الإسبانية:",["وفاة أعداد ضخمة وزيادة الاهتمام بالصحة العامة","القضاء على الأوبئة نهائيًا","اكتشاف البنسلين","لم يكن لها أثر"],0],["ظهر فيروس إيبولا وفقًا للمقرر عام:",["1918م","1976م","2003م","2012م"],1],["الحيوان المرتبط بانتقال متلازمة الشرق الأوسط التنفسية (MERS):",["الخفافيش فقط","الإبل (الجمال)","الطيور","الخنازير"],1],["متلازمة MERS مرض تنفسي حاد يسببه:",["بكتيريا","أحد فيروسات كورونا","فطريات","طفيليات"],1],["الجائحة هي:",["مرض محدود في مدينة واحدة","انتشار عالمي لمرض معدٍ يصيب نسبة كبيرة من السكان في قارات متعددة","مرض وراثي","مرض غير معدٍ"],1],["ما السبب العلمي لزيادة انتشار الفيروسات والأمراض المعدية؟",["تحوّر الفيروسات الجيني المستمر وزيادة السفر والتنقل","قلة عدد السكان","تحسّن النظافة","انتشار اللقاحات"],0],["ما السبب العلمي لسرعة انتشار الفيروسات داخل الجسم والمجتمع؟",["قصر دورتها الحياتية وقدرتها على التكاثر السريع وسهولة انتقالها","كبر حجمها","عدم قدرتها على التحور","ضعفها خارج الجسم فقط"],0],["من أسباب سرعة انتشار الفيروسات في العصر الحديث:",["كثرة السفر والتنقل بين الدول","قلة السكان","تحسن النظافة","اللقاحات"],0],["كيف يسهم السفر في انتشار الفيروسات؟",["ينقل المصاب الفيروس إلى مجتمعات ودول جديدة","يمنع العدوى","يقتل الفيروس","لا علاقة له بالانتشار"],0],["خطورة الفيروسات المستجدة تكمن في:",["أنها لا تتحور","عدم وجود مناعة مسبقة ضدها وقدرتها على التحور","أنها تصيب الحيوانات فقط","سهولة علاجها"],1],["من خطط الحكومات لمواجهة جائحة الإنفلونزا:",["إغلاق المستشفيات","تخزين الأدوية واللقاحات وبرامج التطعيم السريع","إيقاف التوعية","تقليل عدد الأطباء"],1],["يرمز الاختصار WHO إلى:",["وزارة الصحة","منظمة الصحة العالمية","هيئة الصحة العامة","الهلال الأحمر"],1],["ما منظمة الصحة العالمية؟",["وكالة متخصصة تابعة للأمم المتحدة مسؤولة عن الصحة الدولية","منظمة تجارية","مستشفى دولي","شركة أدوية"],0],["الجهة التي تقدم خدمات الرعاية الصحية عبر التجمعات الصحية:",["وزارة الصحة","وزارة التعليم","منظمة الصحة العالمية","القطاع الخاص فقط"],0],["التجمع (العنقود) الصحي هو:",["مستشفى واحد كبير","شبكة من مقدمي الرعاية الصحية تدار بشكل متكامل لخدمة منطقة جغرافية محددة","صيدلية مركزية","مختبر وطني"],1],["الجهة التي ترصد وتقيس وتقيّم عوامل الخطر التي تهدد الصحة العامة:",["وزارة الصحة (وكالة الصحة العامة)","وزارة النقل","الغرفة التجارية","البلدية"],0],["من أدوار هيئة الصحة العامة:",["بناء الطرق","مراقبة الأوبئة والوقاية من الأمراض وتعزيز التوعية","بيع الأدوية","تدريس الطب"],1],["خدمات العيادات الخارجية (Outpatient) هي خدمات:",["تتطلب التنويم أسابيع","تُقدَّم دون تنويم ويعود المريض لمنزله في اليوم نفسه","للطوارئ فقط","تقدم في المنزل"],1],["خدمات الرعاية الطارئة تقدم لـ:",["الفحوص الروتينية","الحالات المفاجئة الخطيرة التي تهدد الحياة","التجميل","كبار السن فقط"],1],["رعاية كبار السن تسمى:",["Pediatric Care","Geriatric Care","Emergency Care","Outpatient Care"],1],["ما المقصود برعاية المسنين؟",["خدمات صحية ونفسية واجتماعية متخصصة لكبار السن","رعاية الأطفال","علاج الطوارئ","الرعاية المنزلية للجميع"],0],["ما يميز المستشفيات الجامعية:",["لا تقدم علاجًا","تجمع بين العلاج والتعليم الطبي والبحث العلمي","للعسكريين فقط","تعمل نهارًا فقط"],1],["من أبرز مرافق الرعاية الصحية:",["المستشفيات ومراكز الرعاية الأولية والعيادات ومراكز إعادة التأهيل","المدارس","المصانع","المطارات"],0],["من أمثلة الرعاية الصحية المنزلية:",["العمليات الجراحية الكبرى","الرعاية التمريضية والعلاج الطبيعي والعناية بالجروح","الأشعة المقطعية","زراعة الأعضاء"],1],["المختبرات الطبية من مرافق الرعاية الصحية ودورها:",["بيع الأدوية","إجراء التحاليل الدقيقة للمساعدة في التشخيص والمتابعة","تنويم المرضى","الإسعاف"],1],["ما المقصود بالتغذية العلاجية؟",["خطط غذائية مخصصة للمرضى حسب حالتهم الصحية للمساهمة في العلاج","حمية لتخفيف الوزن فقط","وجبات المستشفى العامة","منع الطعام عن المريض"],0],["احتواء التكلفة (Cost Containment) هو:",["رفع أسعار الخدمات","إجراءات للحد من تكاليف الرعاية مع المحافظة على الجودة","إلغاء الخدمات الصحية","زيادة مدة التنويم"],1],["ما أهمية احتواء التكلفة في الرعاية الصحية؟",["التحكم بالنفقات مع ضمان جودة عالية وخدمات متاحة وعادلة","زيادة أرباح المستشفيات فقط","تقليل عدد الأطباء","إيقاف العلاج المجاني"],0],["ما المصطلح الإنجليزي المقابل لاحتواء التكلفة؟",["Cost Containment","Cost Sharing","Care Quality","Health Equity"],0],["تقليل مدة البقاء في المستشفى:",["يزيد التكاليف","يساعد على احتواء التكاليف","لا علاقة له بالتكاليف","يقلل الجودة دائمًا"],1],["المجال التقني الذي أسهم في تطورات سريعة في الرعاية الصحية:",["الزراعة","تقنية المعلومات (IT)","التعدين","النسيج"],1],["ما المقصود بالتطبيب عن بُعد؟",["تقديم خدمات الرعاية والاستشارات بتقنيات الاتصال دون حضور شخصي","زيارة الطبيب في المستشفى","العلاج بالأعشاب","الإسعاف الطائر"],0],["من تقنيات التطبيب عن بُعد:",["مكالمات الفيديو والأجهزة القابلة للارتداء","التشريح","الحجامة","التنويم"],0],["من متطلبات التطبيب عن بُعد:",["إنترنت قوي وأجهزة بكاميرا وميكروفون وتطبيقات آمنة","غرفة عمليات","سيارة إسعاف","سرير مستشفى"],0],["من أهمية التطبيب عن بُعد:",["توفير الوقت والجهد وتقليل التكدس وخدمة المناطق النائية","زيادة التكدس في المستشفيات","إلغاء الاستشارات","زيادة التكاليف فقط"],0],["دور المركز السعودي لاعتماد المنشآت الصحية (CBAHI):",["وضع معايير الجودة وسلامة المرضى وتقييم المنشآت واعتمادها","بيع الأدوية","تدريس الطب","الإغاثة الدولية"],0],["من أهمية معايير الاعتماد وسلامة المرضى:",["زيادة الأخطاء الطبية","تقليل الأخطاء ورفع الجودة وتعزيز الثقة","رفع الأسعار","تقليل عدد المرضى"],1],["من المنشآت التي يعتمدها CBAHI:",["المستشفيات ومراكز الرعاية الأولية والمختبرات وبنوك الدم","المدارس","البنوك التجارية","المطارات"],0],["أُسس مركز الملك سلمان للإغاثة والأعمال الإنسانية عام:",["2005م","2015م","2020م","1995م"],1],["من برامج مركز الملك سلمان للإغاثة:",["مشروع «مسام» لنزع الألغام","بناء الملاعب","مشروع الجينوم","اعتماد المستشفيات"],0],["العلاج البديل هو:",["الطب الحديث","استخدام طرق علاجية غير تقليدية بدلًا من الطب الحديث","الجراحة","العلاج الكيميائي"],1],["فكرة الطب البديل تعتمد على:",["وسائل طبيعية تحفّز قدرة الجسم على شفاء نفسه","الأدوية الكيميائية","الجراحة","الأشعة"],0],["من أمثلة الطب التكميلي أو البديل:",["الوخز بالإبر والحجامة والأعشاب والمعالجة المثلية وتقويم العمود الفقري","المضادات الحيوية","الأشعة","غسيل الكلى"],0],["الحجامة تصنف ضمن:",["الطب التكميلي أو البديل","الجراحة العامة","العلاج الكيميائي","الأشعة"],0],["أي مما يلي لا يُعد من الطب التكميلي أو البديل؟",["الجراحة والعلاج الكيميائي والأدوية الصيدلانية المعتمدة","الوخز بالإبر","الحجامة","العلاج بالأعشاب"],0],["من مواضع الحجامة على الجسم:",["الظهر والرأس والذراعين والساقين","القلب","العين مباشرة","العمود الفقري فقط"],0],["العافية هي:",["مجرد غياب المرض","حالة متكاملة من الصحة البدنية والنفسية والاجتماعية","القوة البدنية فقط","الثراء"],1],["أي مما يلي ليس من جوانب العافية الواردة في المقرر؟",["الجسدية","العاطفية","الاقتصادية","الروحية"],2],["القدرة على فهم المشاعر والتعبير عنها والتعامل مع ضغوط الحياة بمرونة هي العافية:",["الفكرية","العاطفية","الجسدية","الاجتماعية"],1],["القدرة على تحفيز العقل والتعلم المستمر وحل المشكلات بنقد وإبداع هي العافية:",["الفكرية","الروحية","العاطفية","الجسدية"],0],["من طرق المحافظة على العافية الجسدية:",["الرياضة والغذاء المتوازن والنوم الكافي","السهر","الوجبات السريعة","قلة الحركة"],0],["ما أهمية العافية في حياة الفرد؟",["رفع جودة الحياة والإنتاجية وتقليل الأمراض المزمنة والتوازن النفسي","زيادة الأمراض","تقليل الإنتاجية","لا أهمية لها"],0],["الخلايا الجذعية:",["متخصصة بوظيفة واحدة","غير متخصصة وقادرة على التحول إلى أنواع مختلفة من الخلايا","خلايا ميتة","خلايا دم فقط"],1],["تتعامل تقنية النانو مع مواد بمقياس:",["1–100 نانومتر","1–100 ملم","1–100 سم","1–100 متر"],0],["من أهداف تقنية النانو في الطب:",["إيصال الدواء مباشرة للخلايا المصابة","زيادة حجم الأدوية","إلغاء التشخيص","زيادة الآثار الجانبية"],0]];
const box=document.getElementById('quiz');
Q.forEach((q,i)=>{
  let h='<div class="q" id="q'+i+'"><span class="tag">سؤال '+(i+1)+' من '+Q.length+'</span><h3>'+q[0]+'</h3>';
  q[1].forEach((o,j)=>{h+='<label id="l'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')">'+o+'</label>';});
  h+='<div class="fb" id="fb'+i+'"></div></div>';
  box.innerHTML+=h;
});
let done=0, score=0;
function pick(i,j){
  const q=Q[i], card=document.getElementById('q'+i);
  if(card.classList.contains('done')) return;
  card.classList.add('done');
  document.getElementById('l'+i+'_'+q[2]).classList.add('correct');
  if(j===q[2]){score++; document.getElementById('fb'+i).textContent='✔ إجابة صحيحة'; document.getElementById('fb'+i).className='fb ok';}
  else{document.getElementById('l'+i+'_'+j).classList.add('wrong'); document.getElementById('fb'+i).textContent='✘ إجابة خاطئة — الصحيح: '+q[1][q[2]]; document.getElementById('fb'+i).className='fb no';}
  done++;
  document.getElementById('bar').textContent='النتيجة: '+score+' من '+done+' (من أصل '+Q.length+' سؤال)';
  document.querySelectorAll('input[name=q'+i+']').forEach(r=>r.disabled=true);
}
</script>
</body>
</html>
